<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENGALURU BEATS</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        blackPure: "#0b0b0b",
        redPrime: "#c4161c",
        yellowPrime: "#f5c400"
      }
    }
  }
}
</script>

<style>
body { background:#0b0b0b; }
.collection-card {
  background: linear-gradient(145deg, #111, #050505);
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  transition: 0.35s ease;
}
.collection-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 30px 60px rgba(196,22,28,0.4);
}
.beat-card {
  background:#111;
  border-radius:18px;
}
</style>
</head>

<body class="text-white">

<!-- HEADER -->
<header class="px-8 py-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold">
    BENGALURU <span class="text-redPrime">BEATS</span>
  </h1>

  <!-- WHATSAPP TOP RIGHT -->
  <a href="https://wa.me/91XXXXXXXXXX" target="_blank"
     class="bg-green-500 text-white px-4 py-2 rounded-full font-bold shadow-lg">
    WhatsApp
  </a>
</header>

<!-- LANDING -->
<section id="landing" class="px-8 min-h-screen flex flex-col justify-center">
  <h2 class="text-5xl md:text-6xl font-extrabold">
    SELECT <span class="text-redPrime">MOOD / GENRE</span>
  </h2>

  <p class="text-gray-400 mt-4 max-w-xl">
    Drill • Trap • Hip Hop • Old School • Experimental
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10 mt-20 max-w-6xl">
    <div onclick="openCollection('drill')" class="collection-card p-10 rounded-2xl cursor-pointer">
      <h3 class="text-3xl font-bold text-redPrime">DRILL</h3>
    </div>

    <div onclick="openCollection('trap')" class="collection-card p-10 rounded-2xl cursor-pointer">
      <h3 class="text-3xl font-bold text-yellowPrime">TRAP</h3>
    </div>

    <div onclick="openCollection('hiphop')" class="collection-card p-10 rounded-2xl cursor-pointer">
      <h3 class="text-3xl font-bold">HIP HOP</h3>
    </div>

    <div onclick="openCollection('oldschool')" class="collection-card p-10 rounded-2xl cursor-pointer">
      <h3 class="text-3xl font-bold text-yellowPrime">OLD SCHOOL</h3>
    </div>

    <div onclick="openCollection('experimental')" class="collection-card p-10 rounded-2xl cursor-pointer">
      <h3 class="text-3xl font-bold text-redPrime">EXPERIMENTAL</h3>
    </div>
  </div>
</section>

<!-- COLLECTION PAGE -->
<section id="collectionPage" class="hidden px-8 py-20">
  <button onclick="goBack()" class="mb-10 text-gray-400 hover:text-white">← Back</button>
  <h2 id="collectionTitle" class="text-4xl font-bold mb-14"></h2>
  <div id="beatsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
</section>

<!-- PLAYER -->
<div id="player" class="fixed bottom-0 left-0 right-0 bg-black border-t border-gray-800 hidden">
  <div class="px-6 py-4 flex justify-between items-center">
    <div>
      <div id="nowTitle" class="font-bold"></div>
      <div id="nowDesc" class="text-gray-400 text-sm"></div>
    </div>
    <audio id="audio" preload="none" controls class="w-1/2"></audio>
  </div>
</div>

<script>
/* ===== EDIT ONLY THIS TO ADD BEATS ===== */
const beats = [
  {
    title: "21",
    collection: "drill",
    price: "₹499",
    description: "Drill type beat • 140 BPM",
    audio: "beats/21.mp3"
  }
];
/* ===================================== */

let currentCollection = "";

function openCollection(type){
  currentCollection = type;
  landing.classList.add("hidden");
  collectionPage.classList.remove("hidden");

  const titles={
    drill:"Drill Beats",
    trap:"Trap Beats",
    hiphop:"Hip Hop Beats",
    oldschool:"Old School Beats",
    experimental:"Experimental Beats"
  };
  collectionTitle.innerText=titles[type];
  renderBeats();
}

function goBack(){
  collectionPage.classList.add("hidden");
  landing.classList.remove("hidden");
  player.classList.add("hidden");
}

function renderBeats(){
  beatsGrid.innerHTML="";
  beats.filter(b=>b.collection===currentCollection).forEach(b=>{
    beatsGrid.innerHTML+=`
      <div class="beat-card p-6">
        <h3 class="text-xl font-bold">${b.title}</h3>
        <p class="text-gray-400 text-sm mt-2">${b.description}</p>

        <div class="mt-4 flex justify-between items-center">
          <span class="text-yellowPrime font-bold">${b.price}</span>
          <button onclick="playBeat('${b.audio}','${b.title}','${b.description}')"
            class="bg-redPrime px-4 py-2 rounded">
            Play
          </button>
        </div>
      </div>
    `;
  });
}

function playBeat(src,title,desc){
  audio.src=src;
  audio.play();
  nowTitle.innerText=title;
  nowDesc.innerText=desc;
  player.classList.remove("hidden");
}
</script>

</body>
</html>
