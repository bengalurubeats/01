<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BENGALURU BEATS</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg:"#0b0b0b",
        red:"#c4161c",
        yellow:"#f5c400"
      }
    }
  }
}
</script>

<style>
body { background:#0b0b0b; }

.card {
  background:#111;
  border-radius:18px;
  transition:.3s;
}
.card:hover {
  transform: translateY(-4px);
}

.wave span {
  width:3px;
  height:10px;
  background:#444;
  display:inline-block;
  animation: wave 1s infinite ease-in-out;
}
.wave span:nth-child(even){ animation-delay:.2s }

@keyframes wave {
  0%,100%{height:8px}
  50%{height:18px}
}
</style>
</head>

<body class="text-white">

<!-- HEADER -->
<header class="px-8 py-6 text-2xl font-bold">
  BENGALURU <span class="text-red">BEATS</span>
</header>

<!-- LANDING -->
<section id="landing" class="px-8 min-h-screen flex flex-col justify-center">
  <h1 class="text-6xl font-extrabold">
    SELECT <span class="text-red">MOOD / GENRE</span>
  </h1>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-10 mt-20 max-w-5xl">
    <div onclick="openCollection('drill')" class="card p-10 cursor-pointer">DRILL</div>
    <div onclick="openCollection('trap')" class="card p-10 cursor-pointer">TRAP</div>
    <div onclick="openCollection('hiphop')" class="card p-10 cursor-pointer">HIP HOP</div>
    <div onclick="openCollection('oldschool')" class="card p-10 cursor-pointer">OLD SCHOOL</div>
    <div onclick="openCollection('experimental')" class="card p-10 cursor-pointer">EXPERIMENTAL</div>
  </div>

  <!-- FAQ -->
  <div class="mt-32 max-w-3xl">
    <h2 class="text-3xl font-bold mb-6">FAQ</h2>
    <p class="text-gray-400">Licensing details will be added soon.</p>
  </div>
</section>

<!-- COLLECTION -->
<section id="collection" class="hidden px-8 py-20">
  <button onclick="goBack()" class="mb-10 text-gray-400">← Back</button>
  <h2 id="title" class="text-5xl font-bold mb-16"></h2>
  <div id="grid" class="space-y-6 max-w-3xl"></div>
</section>

<!-- PLAYER -->
<div id="player" class="fixed bottom-0 left-0 right-0 bg-black p-4 hidden">
  <div class="flex justify-between items-center">
    <div>
      <div id="nowTitle" class="font-bold"></div>
      <div id="nowMeta" class="text-gray-400 text-sm"></div>
    </div>
    <button onclick="togglePlay()" class="bg-red px-6 py-2 rounded">PLAY</button>
  </div>
  <input type="range" id="seek" value="0" class="w-full mt-3">
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/" target="_blank"
 class="fixed bottom-6 right-6 bg-green-500 px-6 py-3 rounded-full font-bold">
 WhatsApp
</a>

<script>
const beats = [
  {
    title:"21",
    collection:"drill",
    bpm:"140 BPM",
    mood:"Dark / Aggressive",
    price:"₹499",
    badge:"NEW",
    audio:"beats/21.mp3"
  }
];

let audio = new Audio();
let currentBeat;

function openCollection(type){
  landing.classList.add("hidden");
  collection.classList.remove("hidden");
  title.innerText = type.toUpperCase();
  grid.innerHTML = "";

  beats.filter(b=>b.collection===type).forEach(b=>{
    grid.innerHTML += `
    <div class="card p-6">
      <div class="flex justify-between">
        <h3 class="text-xl font-bold">${b.title}</h3>
        <span class="text-yellow">${b.badge}</span>
      </div>
      <p class="text-gray-400">${b.bpm} • ${b.mood}</p>

      <div class="wave my-4">
        ${"<span></span>".repeat(20)}
      </div>

      <div class="flex justify-between items-center">
        <span>${b.price}</span>
        <button onclick="playBeat('${b.audio}','${b.title}','${b.bpm} • ${b.mood}')"
        class="bg-red px-4 py-2 rounded">Play</button>
      </div>
    </div>`;
  });
}

function playBeat(src,title,meta){
  audio.src = src;
  audio.play();
  nowTitle.innerText = title;
  nowMeta.innerText = meta;
  player.classList.remove("hidden");
}

function togglePlay(){
  audio.paused ? audio.play() : audio.pause();
}

function goBack(){
  collection.classList.add("hidden");
  landing.classList.remove("hidden");
  player.classList.add("hidden");
}
</script>

</body>
</html>
