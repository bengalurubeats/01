<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ABHI BEATS</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        redPrime: "#c4161c",
        yellowPrime: "#f5c400"
      }
    }
  }
}
</script>

<style>
body { background:#0b0b0b; }
.card {
  background:#111;
  border-radius:16px;
}
.card:hover { transform:scale(1.03); transition:.3s; }
</style>
</head>

<body class="text-white">

<header class="p-6 text-2xl font-bold">
  ABHI<span class="text-redPrime">BEATS</span>
</header>

<!-- LANDING -->
<section id="landing" class="min-h-screen flex flex-col justify-center px-8">
  <h1 class="text-6xl font-extrabold">
    Premium <span class="text-redPrime">Beats</span>
  </h1>

  <div class="mt-20">
    <button onclick="openCollection()"
      class="card px-10 py-6 text-3xl font-bold text-redPrime">
      DRILL
    </button>
  </div>
</section>

<!-- COLLECTION -->
<section id="collection" class="hidden px-8 py-20">
  <button onclick="goBack()" class="mb-10 text-gray-400">← Back</button>

  <div id="beatsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-10"></div>
</section>

<!-- PLAYER -->
<div id="player" class="fixed bottom-0 left-0 right-0 bg-black border-t border-gray-800 hidden">
  <div class="p-4 flex justify-between items-center">
    <div>
      <div id="nowTitle" class="font-bold"></div>
      <div id="nowDesc" class="text-gray-400 text-sm"></div>
    </div>
    <audio id="audio" controls class="w-1/2"></audio>
  </div>
</div>

<script>
/* ====== YOUR BEATS (ONLY EDIT THIS PART LATER) ====== */
const beats = [
  {
    title: "TRIPPY",
    price: "₹499",
    description: "100 BPM • Drill Beat",
    audio: "beats/trippy.mp3",
    image: "images/trippy.png"
  },
  {
    title: "21",
    price: "₹799",
    description: "Dark Drill Beat",
    audio: "beats/21.mp3",
    image: "images/21.png"
  }
];
/* ================================================== */

function openCollection() {
  document.getElementById("landing").classList.add("hidden");
  document.getElementById("collection").classList.remove("hidden");
  renderBeats();
}

function goBack() {
  document.getElementById("collection").classList.add("hidden");
  document.getElementById("landing").classList.remove("hidden");
  document.getElementById("player").classList.add("hidden");
}

function renderBeats() {
  const grid = document.getElementById("beatsGrid");
  grid.innerHTML = "";

  beats.forEach(b => {
    grid.innerHTML += `
      <div class="card p-6">
        <img src="${b.image}" class="rounded-xl mb-4">
        <h3 class="text-xl font-bold">${b.title}</h3>
        <p class="text-gray-400">${b.description}</p>

        <div class="mt-4 flex justify-between items-center">
          <span class="text-yellowPrime font-bold">${b.price}</span>
          <button onclick="playBeat('${b.audio}','${b.title}','${b.description}')"
            class="bg-redPrime px-4 py-2 rounded">
            Play
          </button>
        </div>
      </div>
    `;
  });
}

function playBeat(src, title, desc) {
  const audio = document.getElementById("audio");
  audio.src = src;
  audio.play();
  document.getElementById("nowTitle").innerText = title;
  document.getElementById("nowDesc").innerText = desc;
  document.getElementById("player").classList.remove("hidden");
}
</script>

</body>
</html>
