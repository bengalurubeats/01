<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bengaluru Beats</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #ffcc00;
}

h2 {
  text-align: center;
  margin-top: 10px;
  color: #fff;
}

.beats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #111;
  border-radius: 12px;
  padding: 15px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.title {
  margin: 10px 0 5px;
  font-weight: bold;
}

.player {
  display: flex;
  align-items: center;
  gap: 10px;
}

.play {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: #ff0000;
  color: #fff;
  font-size: 16px;
}

.bar {
  flex: 1;
  height: 6px;
  background: #333;
  border-radius: 3px;
  cursor: pointer;
}

.fill {
  height: 100%;
  width: 0%;
  background: #ffcc00;
  border-radius: 3px;
}

.time {
  font-size: 12px;
}

/* FAQ */
.faq {
  padding: 20px;
}
.faq h3 {
  text-align: center;
}
.faq p {
  color: #aaa;
  font-size: 14px;
}

/* WhatsApp Button */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25d366;
  color: #fff;
  padding: 14px 18px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<header>BENGALURU BEATS</header>
<h2>SELECT MOOD / GENRE</h2>

<section class="beats">

<!-- BEAT 21 -->
<div class="card">
  <img src="images/21.png" loading="lazy">
  <div class="title">21</div>

  <div class="player">
    <button class="play">▶</button>
    <div class="bar"><div class="fill"></div></div>
    <div class="time">0:00</div>
  </div>

  <audio src="beats/21.mp3" preload="none"></audio>
</div>

</section>

<section class="faq">
  <h3>FAQ</h3>
  <p>• License details coming soon</p>
  <p>• Usage rights explained here</p>
</section>

<a class="whatsapp" 
href="https://wa.me/91XXXXXXXXXX?text=I%20want%20to%20buy%20the%20beat%2021">
WhatsApp
</a>

<script>
document.querySelectorAll(".card").forEach(card => {
  const audio = card.querySelector("audio");
  const play = card.querySelector(".play");
  const bar = card.querySelector(".bar");
  const fill = card.querySelector(".fill");
  const time = card.querySelector(".time");

  play.onclick = () => {
    document.querySelectorAll("audio").forEach(a => a.pause());
    audio.paused ? audio.play() : audio.pause();
  };

  audio.ontimeupdate = () => {
    const p = (audio.currentTime / audio.duration) * 100;
    fill.style.width = p + "%";
    time.textContent = Math.floor(audio.currentTime) + "s";
  };

  bar.onclick = e => {
    const percent = e.offsetX / bar.offsetWidth;
    audio.currentTime = percent * audio.duration;
  };
});
</script>

</body>
</html>
